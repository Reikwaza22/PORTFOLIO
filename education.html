<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="container">
            <h2>Education</h2>
            <div class="education-list">
                <div class="education-item">
                    <h3>Elementary</h3>
                    <div class="school">Pardo Elementary School</div>
                    <div class="period">Graduated: 2018</div>
                </div>

                <div class="education-item">
                    <h3>High School</h3>
                    <div class="school">Pardo National High School</div>
                    <div class="period">Graduated: 2022</div>
                </div>

                <div class="education-item">
                    <h3>Senior High School</h3>
                    <div class="school">Abellana National School</div>
                    <div class="period">Graduated: 2024</div>
                </div>

                <div class="education-item">
                    <h3>College</h3>
                    <div class="school">Cebu Institute of Technology - University BS Information Technology</div>
                    <div class="period">Currently: 2025-2026</div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
